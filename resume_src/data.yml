# =====================================================================
# data.yml — SOURCE OF TRUTH for resume, CV, and site HTML resume fragment.
#
# HOW TO EDIT:
#   - Bullet / section text is written in LaTeX-flavored plain text:
#       en-dash = `--`, em-dash = `---`, ampersand = `\&`, percent = `\%`,
#       thousands sep = `{,}`, explicit space = `\;`, italics = `\textit{...}`,
#       bold = `\textbf{...}`, links = `\href{url}{anchor}`.
#     The build's HTML filter converts these to HTML equivalents for the
#     site fragment. Anything it can't convert will pass through verbatim;
#     keep content simple and the filter will stay boring.
#
#   - Every entry and every bullet has a `targets:` list. Valid values:
#       [resume]     show on resume only
#       [cv]         show on CV only
#       [resume, cv] show on both (default behavior if omitted)
#     This is how resume/CV divergence is managed. When in doubt, use
#     [resume, cv] and let brevity happen at render time.
#
#   - After ANY edit here:
#       1. python resume_src/build.py
#       2. cd assets && pdflatex -interaction=nonstopmode resume.tex && pdflatex -interaction=nonstopmode cv.tex
#       3. Open both PDFs and the updated resume.html, verify they look sane.
#     See CLAUDE.md at repo root for the full workflow.
# =====================================================================

