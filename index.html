  <!-- ====== HERO ====== -->
  <section class="hero">
    <canvas class="hero__canvas" id="pixel-canvas"></canvas>
    <div class="hero__overlay"></div>
    <div class="hero__content">
      <h1 class="hero__name">Jacob Brinton</h1>

    </div>

    <!-- Left controls: vertical sliders -->
    <div class="hero__ctrl-left">
      <div class="ctrl-vslider ctrl-vslider--px">
        <input type="range" min="2" max="16" value="6" step="1" id="ctrl-pixelsize" orient="vertical">
      </div>
      <div class="ctrl-vslider ctrl-vslider--clr">
        <input type="range" min="4" max="32" value="12" step="1" id="ctrl-colors" orient="vertical">
      </div>
    </div>

    <!-- Right controls: dither + palette icons -->
    <div class="hero__ctrl-right">
      <div class="ctrl-icon-group">
        <!-- Dither: off (pixelated yin-yang, fills the square) -->
        <button class="ctrl-icon" data-dither="0" title="No dithering">
          <svg viewBox="0 0 8 8" width="20" height="20" shape-rendering="crispEdges">
            <!-- Dark half (left) -->
            <rect x="0" y="0" width="4" height="8" fill="currentColor"/>
            <!-- Light half (right) -->
            <rect x="4" y="0" width="4" height="8" fill="currentColor" opacity="0.25"/>
            <!-- S-curve: dark bulges right at top -->
            <rect x="4" y="0" width="1" height="1" fill="currentColor"/>
            <rect x="4" y="1" width="2" height="1" fill="currentColor"/>
            <rect x="4" y="2" width="2" height="1" fill="currentColor"/>
            <rect x="4" y="3" width="1" height="1" fill="currentColor"/>
            <!-- S-curve: light bulges left at bottom -->
            <rect x="3" y="4" width="1" height="1" fill="currentColor" opacity="0.25"/>
            <rect x="2" y="5" width="2" height="1" fill="currentColor" opacity="0.25"/>
            <rect x="2" y="6" width="2" height="1" fill="currentColor" opacity="0.25"/>
            <rect x="3" y="7" width="1" height="1" fill="currentColor" opacity="0.25"/>
            <!-- Light dot in dark half -->
            <rect x="3" y="1" width="1" height="1" fill="currentColor" opacity="0.25"/>
            <!-- Dark dot in light half -->
            <rect x="4" y="6" width="1" height="1" fill="currentColor"/>
          </svg>
        </button>
        <!-- Dither: ordered -->
        <button class="ctrl-icon on" data-dither="1" title="Ordered dithering">
          <svg viewBox="0 0 8 8" width="20" height="20">
            <rect width="8" height="8" fill="currentColor" opacity="0.3"/>
            <rect x="0" y="0" width="2" height="2" fill="currentColor"/><rect x="4" y="0" width="2" height="2" fill="currentColor"/>
            <rect x="2" y="2" width="2" height="2" fill="currentColor"/><rect x="6" y="2" width="2" height="2" fill="currentColor"/>
            <rect x="0" y="4" width="2" height="2" fill="currentColor"/><rect x="4" y="4" width="2" height="2" fill="currentColor"/>
            <rect x="2" y="6" width="2" height="2" fill="currentColor"/><rect x="6" y="6" width="2" height="2" fill="currentColor"/>
          </svg>
        </button>
        <!-- Dither: Floyd-Steinberg -->
        <button class="ctrl-icon" data-dither="2" title="Floyd-Steinberg dithering">
          <svg viewBox="0 0 8 8" width="20" height="20">
            <rect width="8" height="8" fill="currentColor" opacity="0.15"/>
            <rect x="1" y="0" width="1" height="1" fill="currentColor"/><rect x="5" y="0" width="1" height="1" fill="currentColor"/>
            <rect x="3" y="1" width="1" height="1" fill="currentColor"/><rect x="7" y="1" width="1" height="1" fill="currentColor"/>
            <rect x="0" y="2" width="1" height="1" fill="currentColor"/><rect x="4" y="2" width="1" height="1" fill="currentColor"/>
            <rect x="2" y="3" width="1" height="1" fill="currentColor"/><rect x="6" y="3" width="1" height="1" fill="currentColor"/>
            <rect x="1" y="4" width="1" height="1" fill="currentColor"/><rect x="5" y="4" width="1" height="1" fill="currentColor"/>
            <rect x="3" y="5" width="1" height="1" fill="currentColor"/><rect x="7" y="5" width="1" height="1" fill="currentColor" opacity="0.7"/>
            <rect x="0" y="6" width="1" height="1" fill="currentColor" opacity="0.7"/><rect x="4" y="6" width="1" height="1" fill="currentColor" opacity="0.5"/>
            <rect x="2" y="7" width="1" height="1" fill="currentColor" opacity="0.5"/><rect x="6" y="7" width="1" height="1" fill="currentColor" opacity="0.3"/>
          </svg>
        </button>
      </div>
      <div class="ctrl-icon-sep"></div>
      <div class="ctrl-icon-group">
        <!-- Palette: Auto -->
        <button class="ctrl-icon on" data-palette="-1" title="Auto-extract palette">
          <svg viewBox="0 0 8 8" width="20" height="20">
            <rect x="1" y="1" width="2" height="2" fill="#fb6182"/><rect x="4" y="1" width="2" height="2" fill="#ffb347"/>
            <rect x="1" y="4" width="2" height="2" fill="#5a9fd4"/><rect x="4" y="4" width="2" height="2" fill="#7ab87a"/>
          </svg>
        </button>
        <!-- Palette: Dusk -->
        <button class="ctrl-icon" data-palette="0" title="Dusk">
          <svg viewBox="0 0 8 8" width="20" height="20">
            <rect width="4" height="4" fill="#1a1a5e"/><rect x="4" width="4" height="4" fill="#7c6fa0"/>
            <rect y="4" width="4" height="4" fill="#ff7043"/><rect x="4" y="4" width="4" height="4" fill="#ffb347"/>
          </svg>
        </button>
        <!-- Palette: GB -->
        <button class="ctrl-icon" data-palette="1" title="Game Boy">
          <svg viewBox="0 0 8 8" width="20" height="20">
            <rect width="4" height="4" fill="#0f380f"/><rect x="4" width="4" height="4" fill="#306230"/>
            <rect y="4" width="4" height="4" fill="#8bac0f"/><rect x="4" y="4" width="4" height="4" fill="#9bbc0f"/>
          </svg>
        </button>
        <!-- Palette: Sunset -->
        <button class="ctrl-icon" data-palette="3" title="Sunset">
          <svg viewBox="0 0 8 8" width="20" height="20">
            <rect width="4" height="4" fill="#3d1a5e"/><rect x="4" width="4" height="4" fill="#cc4488"/>
            <rect y="4" width="4" height="4" fill="#ff7043"/><rect x="4" y="4" width="4" height="4" fill="#ffd700"/>
          </svg>
        </button>
        <!-- Palette: Ocean -->
        <button class="ctrl-icon" data-palette="4" title="Ocean">
          <svg viewBox="0 0 8 8" width="20" height="20">
            <rect width="4" height="4" fill="#0a1628"/><rect x="4" width="4" height="4" fill="#2a6ab5"/>
            <rect y="4" width="4" height="4" fill="#5a9fd4"/><rect x="4" y="4" width="4" height="4" fill="#d0eeff"/>
          </svg>
        </button>
        <!-- Palette: Forest -->
        <button class="ctrl-icon" data-palette="5" title="Forest">
          <svg viewBox="0 0 8 8" width="20" height="20">
            <rect width="4" height="4" fill="#0a0f0a"/><rect x="4" width="4" height="4" fill="#2d5a3d"/>
            <rect y="4" width="4" height="4" fill="#4a8c5c"/><rect x="4" y="4" width="4" height="4" fill="#b0d4a0"/>
          </svg>
        </button>
      </div>
    </div>

  </section>

  <!-- ====== BIO TYPER SECTION ====== -->
  <section class="section bio-typer">
    <div class="section__inner bio-typer__inner">

      <!-- Row 1: text left, icon right -->
      <div class="bio-typer__row">
        <div class="bio-typer__line" data-typer="working"></div>
        <div class="bio-typer__icon">
          <!-- Pencil at 45° (32x32) -->
          <svg viewBox="0 0 32 32" shape-rendering="crispEdges">
            <!-- Writing marks -->
            <rect x="4" y="29" width="1" height="1" fill="#fb6182" opacity="0.35"/>
            <rect x="5" y="28" width="1" height="1" fill="#fb6182" opacity="0.35"/>
            <rect x="3" y="28" width="1" height="1" fill="#fb6182" opacity="0.25"/>

            <rect x="9" y="23" width="1" height="3" fill="#fb6182"/>

            <!-- Ferrule -->

            <rect x="12" y="20" width="1" height="3" fill="#ffb347"/>

            <rect x="17" y="15" width="1" height="3" fill="#f0f0f5"/>
            <rect x="18" y="14" width="1" height="3" fill="#e0e0ea"/>
            <rect x="19" y="13" width="1" height="3" fill="#f0f0f5"/>
            <rect x="20" y="12" width="1" height="3" fill="#e0e0ea"/>
            <rect x="21" y="11" width="1" height="3" fill="#f0f0f5"/>
            <rect x="22" y="10" width="1" height="3" fill="#e0e0ea"/>
            <!-- Eraser band -->
            <rect x="23" y="9" width="1" height="3" fill="#ffb347"/>
            <rect x="24" y="8" width="1" height="3" fill="#ffb347"/>
            <!-- Eraser -->
            <rect x="25" y="7" width="1" height="3" fill="#ffb4c5"/>

        </div>
      </div>

      <!-- Row 2: icon left, text right (flipped) -->
      <div class="bio-typer__row bio-typer__row--flip">
        <div class="bio-typer__line" data-typer="pastlife"></div>
        <div class="bio-typer__icon">
          <!-- Satellite (32x32) -->
          <svg viewBox="0 0 32 32" shape-rendering="crispEdges">
            <!-- Left solar panel -->
            <rect x="1" y="11" width="10" height="12" fill="#fb6182"/>
            <rect x="4" y="11" width="1" height="12" fill="#ffb4c5"/>
            <rect x="7" y="11" width="1" height="12" fill="#ffb4c5"/>
            <rect x="1" y="14" width="10" height="1" fill="#ffb4c5"/>
            <rect x="1" y="17" width="10" height="1" fill="#ffb4c5"/>
            <rect x="1" y="20" width="10" height="1" fill="#ffb4c5"/>
            <!-- Left arm -->
            <rect x="11" y="15" width="2" height="4" fill="#8888a0"/>
            <!-- Body -->
            <rect x="13" y="13" width="6" height="8" fill="#f0f0f5"/>
            <rect x="14" y="14" width="4" height="6" fill="#1a1a28"/>
            <rect x="15" y="15" width="1" height="1" fill="#fb6182"/>
            <rect x="17" y="15" width="1" height="1" fill="#ffb347"/>
            <rect x="15" y="17" width="2" height="2" fill="#8888a0"/>
            <!-- Right arm -->
            <rect x="19" y="15" width="2" height="4" fill="#8888a0"/>
            <!-- Right solar panel -->
            <rect x="21" y="11" width="10" height="12" fill="#fb6182"/>
            <rect x="24" y="11" width="1" height="12" fill="#ffb4c5"/>
            <rect x="27" y="11" width="1" height="12" fill="#ffb4c5"/>
            <rect x="21" y="14" width="10" height="1" fill="#ffb4c5"/>
            <rect x="21" y="17" width="10" height="1" fill="#ffb4c5"/>
            <rect x="21" y="20" width="10" height="1" fill="#ffb4c5"/>
            <!-- Antenna -->
            <rect x="15" y="9" width="2" height="4" fill="#ffb347"/>
            <rect x="13" y="7" width="6" height="2" fill="#ffb347"/>
            <rect x="14" y="6" width="4" height="1" fill="#ffb347"/>
          </svg>
        </div>
      </div>

      <!-- Row 3: text left, icon right -->
      <div class="bio-typer__row">
        <div class="bio-typer__line" data-typer="enjoy"></div>
        <div class="bio-typer__icon">
          <!-- Stars / sparkles (32x32) -->
          <svg viewBox="0 0 32 32" shape-rendering="crispEdges">
            <!-- Large star at (9,14) -->
            <rect x="9" y="7" width="1" height="15" fill="#fb6182"/>
            <rect x="2" y="14" width="15" height="1" fill="#fb6182"/>
            <rect x="8" y="13" width="1" height="3" fill="#fb6182"/>
            <rect x="10" y="13" width="1" height="3" fill="#fb6182"/>
            <rect x="7" y="14" width="1" height="1" fill="#fb6182"/>
            <rect x="11" y="14" width="1" height="1" fill="#fb6182"/>
            <!-- Large star glow -->
            <rect x="8" y="12" width="1" height="1" fill="#ffb4c5" opacity="0.5"/>
            <rect x="10" y="12" width="1" height="1" fill="#ffb4c5" opacity="0.5"/>
            <rect x="8" y="16" width="1" height="1" fill="#ffb4c5" opacity="0.5"/>
            <rect x="10" y="16" width="1" height="1" fill="#ffb4c5" opacity="0.5"/>
            <!-- Medium star at (24,8) -->
            <rect x="24" y="4" width="1" height="9" fill="#ffb347"/>
            <rect x="20" y="8" width="9" height="1" fill="#ffb347"/>
            <rect x="23" y="7" width="1" height="3" fill="#ffb347"/>
            <rect x="25" y="7" width="1" height="3" fill="#ffb347"/>
            <!-- Small star at (24,24) -->
            <rect x="24" y="22" width="1" height="5" fill="#ffb4c5"/>
            <rect x="22" y="24" width="5" height="1" fill="#ffb4c5"/>
            <!-- Tiny dots -->
            <rect x="5" y="26" width="1" height="1" fill="#ffb347"/>
            <rect x="15" y="4" width="1" height="1" fill="#ffb4c5"/>
            <rect x="28" y="19" width="1" height="1" fill="#8888a0"/>
            <rect x="3" y="5" width="1" height="1" fill="#fb6182" opacity="0.6"/>
            <rect x="19" y="28" width="1" height="1" fill="#ffb347" opacity="0.5"/>
            <rect x="29" y="11" width="1" height="1" fill="#ffb4c5" opacity="0.4"/>
          </svg>
        </div>
      </div>

    </div>
