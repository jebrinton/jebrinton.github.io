<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Opening in Claude</title>
<!-- Hand-written, not generated by site_src. Forwards a chat id in the URL fragment
     (never sent to the server) to the Claude desktop app. Used by Yok's Chat Strip Board. -->
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F3F4F9;color:#0B1330;font:16px/1.45 system-ui,-apple-system,sans-serif;padding:16px;box-sizing:border-box}
  main{max-width:34rem;text-align:center}
  a.btn{display:inline-block;margin-top:12px;background:#15295E;color:#fff;text-decoration:none;font-weight:600;padding:10px 18px;border-radius:4px}
  p.small{color:#46506F;font-size:14px}
  @media (prefers-color-scheme:dark){body{background:#0A0E1C;color:#EEF1FB} a.btn{background:#9DB3F4;color:#0A0E1C} p.small{color:#A9B2D2}}
</style>
</head>
<body>
<main>
  <p id="msg">Opening the chat in Claude…</p>
  <a class="btn" id="go" href="#" hidden>Open in Claude</a>
  <p class="small" id="hint" hidden>If nothing happened, press the button. You can close this tab afterwards.</p>
</main>
<script>
(function () {
  var id = decodeURIComponent(location.hash.slice(1));
  var target = null;
  if (/^cse_[A-Za-z0-9]{10,64}$/.test(id)) target = "claude://claude.ai/cowork/" + id;
  else if (/^local_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(id)) target = "claude://claude.ai/epitaxy/" + id;
  var msg = document.getElementById("msg");
  if (!target) { msg.textContent = "This link doesn't name a Claude chat."; return; }
  var go = document.getElementById("go");
  go.href = target; go.hidden = false; document.getElementById("hint").hidden = false;
  location.replace(target);
})();
</script>
</body>
</html>
