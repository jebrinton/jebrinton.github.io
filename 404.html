<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 &mdash; Jacob Brinton</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="stylesheet" href="assets/site.css">
  <style>
    .four-oh-four {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      background: var(--ink);
    }
    .four-oh-four__canvas {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    .four-oh-four__canvas canvas {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .four-oh-four__content {
      position: relative;
      z-index: 1;
      padding: 0 6vw;
      color: var(--paper);
    }
    .four-oh-four__code {
      font-family: var(--heading-stack);
      font-size: clamp(5rem, 15vw, 10rem);
      color: var(--accent);
      opacity: 0.4;
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    .four-oh-four__content h1 {
      font-family: var(--heading-stack);
      font-size: clamp(1.4rem, 4vw, 2.5rem);
      font-weight: 400;
      color: var(--paper);
      margin-bottom: 1rem;
    }
    .four-oh-four__text {
      font-size: 16px;
      color: var(--paper-soft);
      max-width: 500px;
      margin: 0 auto 2rem;
      line-height: 1.6;
    }
    .four-oh-four__back {
      display: inline-block;
      padding: 10px 28px;
      border: 1.5px solid var(--paper);
      color: var(--paper);
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transition: background 0.2s, color 0.2s;
    }
    .four-oh-four__back:hover {
      background: var(--paper);
      color: var(--ink);
      filter: none;
    }
  </style>
</head>
<body>

  <nav class="nav" id="site-nav" role="navigation" aria-label="Main navigation">
    <a href="index.html" class="nav__home">Jacob Brinton</a>
    <ul class="nav__links" role="list">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="travels.html">Travels</a></li>
      <li><a href="offline.html">Offline</a></li>
      <li><a href="resume.html">Resume</a></li>
    </ul>
    <button class="nav__hamburger" aria-label="Toggle menu" aria-expanded="false"
            onclick="var n=document.getElementById('site-nav');n.classList.toggle('nav--open');this.setAttribute('aria-expanded',n.classList.contains('nav--open'))">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <section class="four-oh-four">
    <div class="four-oh-four__canvas" id="glitch-canvas"></div>
    <div class="four-oh-four__content">
      <div class="four-oh-four__code">404</div>
      <h1>Lost between opinions</h1>
      <p class="four-oh-four__text">
        This page got lost somewhere between my wrong opinions. It might have been right once, but I&rsquo;ve since updated.
      </p>
      <a href="index.html" class="four-oh-four__back">Back to safety</a>
    </div>
  </section>

  <script>
    // Glitching pixel art animation for 404
    (function () {
      const container = document.getElementById('glitch-canvas');
      if (!container) return;

      const canvas = document.createElement('canvas');
      container.appendChild(canvas);
      const ctx = canvas.getContext('2d');
      const PS = 8; // pixel size
      const colors = ['#fb6182', '#ffb4c5', '#0a0a0f', '#12121a', '#1a1a28', '#2a2a3a', '#ffb347'];

      function resize() {
        canvas.width = Math.ceil(window.innerWidth / PS);
        canvas.height = Math.ceil(window.innerHeight / PS);
      }

      function draw() {
        const w = canvas.width, h = canvas.height;
        const img = ctx.createImageData(w, h);

        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const i = (y * w + x) * 4;
            // Mostly dark with occasional accent pixels
            if (Math.random() < 0.03) {
              const c = colors[Math.floor(Math.random() * colors.length)];
              const r = parseInt(c.slice(1, 3), 16);
              const g = parseInt(c.slice(3, 5), 16);
              const b = parseInt(c.slice(5, 7), 16);
              img.data[i] = r; img.data[i + 1] = g; img.data[i + 2] = b; img.data[i + 3] = 255;
            } else {
              // Dark with slight variation
              const v = 8 + Math.floor(Math.random() * 8);
              img.data[i] = v; img.data[i + 1] = v; img.data[i + 2] = v + 4; img.data[i + 3] = 255;
            }
          }
        }
        ctx.putImageData(img, 0, 0);
      }

      resize();
      draw();
      // Glitch: redraw occasionally
      setInterval(draw, 2000);
      window.addEventListener('resize', () => { resize(); draw(); });
    })();
  </script>
</body>
</html>
