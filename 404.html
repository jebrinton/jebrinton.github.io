  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .four-oh-four {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      background: var(--bg-deep);
    }
    .four-oh-four__canvas {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    .four-oh-four__canvas canvas {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .four-oh-four__content {
      position: relative;
      z-index: 1;
      padding: 0 var(--sp-4);
    }
    .four-oh-four__code {
      font-family: var(--font-mono);
      font-size: clamp(5rem, 15vw, 10rem);
      color: var(--accent);
      opacity: 0.3;
      line-height: 1;
      margin-bottom: var(--sp-2);
    }
    .four-oh-four__text {
      font-size: var(--text-md);
      color: var(--text-muted);
      max-width: 500px;
      margin: 0 auto var(--sp-4);
    }
  </style>
</head>

  <section class="four-oh-four">
    <div class="four-oh-four__canvas" id="glitch-canvas"></div>
    <div class="four-oh-four__content">
      <div class="four-oh-four__code">404</div>
      <h1 style="margin-bottom:var(--sp-2);">Lost between opinions</h1>
      <p class="four-oh-four__text">
        This page got lost somewhere between my wrong opinions. It might have been right once, but I've since updated.
      </p>
      <a href="/" class="btn btn--primary">Back to safety</a>
    </div>

  <script src="js/nav.js" defer></script>
  <script>
    // Glitching pixel art animation for 404
    (function () {
      const container = document.getElementById('glitch-canvas');
      if (!container) return;

      const canvas = document.createElement('canvas');
      container.appendChild(canvas);
      const ctx = canvas.getContext('2d');
      const PS = 8; // pixel size
      const colors = ['#fb6182', '#ffb4c5', '#0a0a0f', '#12121a', '#1a1a28', '#2a2a3a', '#ffb347'];

      function resize() {
        canvas.width = Math.ceil(window.innerWidth / PS);
        canvas.height = Math.ceil(window.innerHeight / PS);
      }

      function draw() {
        const w = canvas.width, h = canvas.height;
        const img = ctx.createImageData(w, h);

        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const i = (y * w + x) * 4;
            // Mostly dark with occasional accent pixels
            if (Math.random() < 0.03) {
              const c = colors[Math.floor(Math.random() * colors.length)];
              const r = parseInt(c.slice(1, 3), 16);
              const g = parseInt(c.slice(3, 5), 16);
              const b = parseInt(c.slice(5, 7), 16);
              img.data[i] = r; img.data[i + 1] = g; img.data[i + 2] = b; img.data[i + 3] = 255;
            } else {
              // Dark with slight variation
              const v = 8 + Math.floor(Math.random() * 8);
              img.data[i] = v; img.data[i + 1] = v; img.data[i + 2] = v + 4; img.data[i + 3] = 255;
            }
          }
        }
        ctx.putImageData(img, 0, 0);
      }

      resize();
      draw();
      // Glitch: redraw occasionally
      setInterval(draw, 2000);
      window.addEventListener('resize', () => { resize(); draw(); });
    })();
  </script>
</body>
